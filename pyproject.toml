[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["data/piccolo_migrations"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # undefined names and unused imports
    "I",      # import ordering
    "B",      # likely bugs
    "UP",     # modern Python syntax
    "SIM",    # unnecessary or overly complicated constructs
    "C4",     # cleaner comprehensions
    "RUF",    # Ruff-specific correctness rules
    "ASYNC",  # async-code problems
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
